[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gliner-fewshot-ner"
version = "0.1.0"
description = "Few-shot clinical NER using frozen GLiNER encoder with Point and Gaussian Prototypes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gliner==0.2.24",
    "torch>=2.2.0",
    "transformers>=4.51,<5",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "datasets>=2.18.0",
    "evaluate>=0.4.1",
    "netcal>=1.3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
